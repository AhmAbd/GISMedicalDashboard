services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: medical_tracker
      POSTGRES_PASSWORD: medical
      POSTGRES_USER: medical
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical -d medical_tracker"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - medical_db:/var/lib/postgresql/data

volumes:
  medical_db:

